<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">José Mateus — dev jr em IA, rumo a AI Engineer</title>
  <style>
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .in { opacity: 0; animation: in .6s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .7s; } .d3 { animation-delay: 1.2s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    .tape { animation: tape 30s linear infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @keyframes pulse { 50% { opacity: .25; } }
    @keyframes tape { from { transform: translateX(0); } to { transform: translateX(-900px); } }
    @media (prefers-reduced-motion: reduce) {
      .in, .cursor, .pulse, .tape { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="frame"><rect width="900" height="250" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="250" fill="#0a0e13"/>

    <circle cx="24" cy="22" r="5.5" fill="#3a414b"/>
    <circle cx="42" cy="22" r="5.5" fill="#3a414b"/>
    <circle cx="60" cy="22" r="5.5" fill="#3a414b"/>

    <g class="mono" font-size="12" fill="#9198a1">
      <circle class="pulse" cx="770" cy="18" r="4" fill="#f0b429"/>
