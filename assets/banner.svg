    </g>

    <text class="mono in d1" x="40" y="74" font-size="14" fill="#9198a1">~/josemateus $ whoami</text>
    <text class="mono in d2" x="38" y="130" font-size="48" font-weight="800" fill="#e6edf3">José Mateus<tspan class="cursor" fill="#f0b429">_</tspan></text>
    <text class="mono in d3" x="40" y="166" font-size="16" fill="#c9d1d9">dev jr em ia · rumo a ai engineer</text>

    <line x1="0" y1="204" x2="900" y2="204" stroke="#1e252e"/>
    <g class="tape mono" font-size="13" fill="#9198a1">
      <text x="0" y="232" textLength="900" lengthAdjust="spacing"><tspan fill="#f0b429">▲</tspan> python   <tspan fill="#f0b429">▲</tspan> inteligência artificial   <tspan fill="#f0b429">▲</tspan> dados   <tspan fill="#f0b429">▲</tspan> automação   <tspan fill="#f0b429">▲</tspan> mercado de futuros   <tspan fill="#f0b429">▲</tspan> nlp   <tspan fill="#f0b429">▲</tspan> llms   </text>
      <text x="900" y="232" textLength="900" lengthAdjust="spacing"><tspan fill="#f0b429">▲</tspan> python   <tspan fill="#f0b429">▲</tspan> inteligência artificial   <tspan fill="#f0b429">▲</tspan> dados   <tspan fill="#f0b429">▲</tspan> automação   <tspan fill="#f0b429">▲</tspan> mercado de futuros   <tspan fill="#f0b429">▲</tspan> nlp   <tspan fill="#f0b429">▲</tspan> llms   </text>
    </g>
